<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Florence</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f6f2;
      color: #333;
      line-height: 1.6;
    }

    .container {
      width: min(1000px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      color: #333;
      text-decoration: none;
      font-size: 15px;
    }

    .back:hover {
      opacity: 0.6;
    }

    .language-toggle {
      display: flex;
      gap: 6px;
    }

    .language-toggle button {
      border: none;
      background: transparent;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
      color: #777;
    }

    .language-toggle button.active {
      color: #333;
      font-weight: 600;
    }

    header {
      text-align: center;
      padding: 45px 0 55px;
    }

    header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 7vw, 70px);
      font-weight: 400;
      margin-bottom: 10px;
    }

    header p {
      color: #777;
      font-size: 16px;
    }

    section {
      margin-bottom: 50px;
    }

    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 22px;
    }

    .day {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
    }

    .day h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .date {
      color: #888;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .place {
      padding: 14px 0;
      border-top: 1px solid #eee;
    }

    .place:first-of-type {
      border-top: none;
    }

    .place-name {
      font-weight: 600;
      font-size: 16px;
    }

    .place-time {
      color: #777;
      font-size: 14px;
      margin-top: 3px;
    }

    .address {
      color: #888;
      font-size: 13px;
      margin-top: 4px;
    }

    .note {
      color: #666;
      font-size: 14px;
      font-style: italic;
      margin-top: 6px;
    }

    .possible-place {
      background: white;
      border-radius: 14px;
      padding: 20px 25px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .possible-place h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .possible-place p {
      color: #666;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 35px 0 50px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 28px, 1000px);
      }

      nav {
        height: 65px;
      }

      header {
        padding: 35px 0 45px;
      }

      .day {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <nav>
      <a href="index.html" class="back">
        <span data-en="← Back" data-es="← Volver">← Back</span>
      </a>

      <div class="language-toggle">
        <button id="enBtn" class="active" onclick="setLanguage('en')">EN</button>
        <button id="esBtn" onclick="setLanguage('es')">ES</button>
      </div>
    </nav>

    <header>
      <h1 data-en="Florence" data-es="Florencia">Florence</h1>
      <p
        data-en="October 18 – November 2, 2026"
        data-es="18 de octubre – 2 de noviembre de 2026"
      >
        October 18 – November 2, 2026
      </p>
    </header>

    <!-- SCHEDULED ITINERARY -->

    <section>
      <h2
        class="section-title"
        data-en="Itinerary"
        data-es="Itinerario"
      >
        Itinerary
      </h2>

      <!-- Add your Florence days here -->

      <div class="day">
        <h3
          data-en="Day 1"
          data-es="Día 1"
        >
          Day 1
        </h3>

        <div class="date"
          data-en="Date TBD"
          data-es="Fecha por determinar"
        >
          Date TBD
        </div>

        <!-- Example place -->
        <div class="place">
          <div
            class="place-name"
            data-en="Place Name"
            data-es="Nombre del lugar"
          >
            Place Name
          </div>

          <div
            class="place-time"
            data-en="Time TBD"
            data-es="Hora por determinar"
          >
            Time TBD
          </div>

          <div class="address">
            Address goes here
          </div>

          <div
            class="note"
            data-en="Notes about this place go here."
            data-es="Las notas sobre este lugar van aquí."
          >
            Notes about this place go here.
          </div>
        </div>
      </div>

    </section>


    <!-- POSSIBLE PLACES -->

    <section>
      <h2
        class="section-title"
        data-en="Possible Places"
        data-es="Lugares posibles"
      >
        Possible Places
      </h2>

      <!-- Add TBD places here -->

      <div class="possible-place">
        <h3
          data-en="Place Name"
          data-es="Nombre del lugar"
        >
          Place Name
        </h3>

        <p
          data-en="Add information about the place here."
          data-es="Añade aquí información sobre el lugar."
        >
          Add information about the place here.
        </p>

        <div class="address">
          Address goes here
        </div>
      </div>

    </section>


    <footer>
      <span
        data-en="Europe Trip 2026"
        data-es="Viaje por Europa 2026"
      >
        Europe Trip 2026
      </span>
    </footer>

  </div>


  <script>
    function setLanguage(language) {
      document.querySelectorAll("[data-en]").forEach(function(element) {
        element.textContent = element.getAttribute("data-" + language);
      });

      document.getElementById("enBtn").classList.toggle(
        "active",
        language === "en"
      );

      document.getElementById("esBtn").classList.toggle(
        "active",
        language === "es"
      );

      document.documentElement.lang = language;
    }
  </script>

</body>
</html>
